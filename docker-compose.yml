version: '3.8'

services:
  fuseki:
    image: secoresearch/fuseki:5.4.0
    container_name: fuseki-dev
    ports:
      - "3030:3030"
    volumes:
      # Persistent databases
      - ./data/databases:/fuseki-base/databases
      # Configuration
      - ./fuseki/config.ttl:/fuseki-base/config.ttl:ro
      - ./fuseki/log4j2.properties:/fuseki-base/log4j2.properties:ro
    environment:
      - FUSEKI_BASE=/fuseki-base
      - JAVA_OPTIONS=-Xmx4g -Xms2g -Dfile.encoding=UTF-8
      # Admin credentials (use .env in production)
      - ADMIN_PASSWORD=admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
