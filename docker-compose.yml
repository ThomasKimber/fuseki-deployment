version: '3.8'

services:
  fuseki:
    image: secoresearch/fuseki:5.4.0
    container_name: fuseki-dev
    ports:
      - "3030:3030"
    user: "1000:1000"
    volumes:
      # Persistent databases
      - /opt/docker-data/fuseki:/fuseki-base
    environment:
      - JAVA_OPTIONS=-Xmx4g -Xms2g -Dfile.encoding=UTF-8
      - ADMIN_PASSWORD=admin
      - ENABLE_DATA_WRITE=true
      - ENABLE_UPDATE=true
      - QUERY_TIMEOUT=60
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
